plugins {
    id 'com.android.application'
}

// Release signing: launcher/keystore.properties (not in git) points at your own keystore. Without it the
// release build is left unsigned and scripts/deploy.sh falls back to the debug build.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinks and optimises the code and drops unused resources: a smaller, quicker APK on 1 GB TVs.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
